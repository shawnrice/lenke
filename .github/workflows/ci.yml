name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on a PR branch; let pushes to main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: check · build · test (TypeScript + Rust)
    runs-on: ubuntu-latest
    steps:
      # checkout pinned to v6 (v4 is deprecated / EOL).
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0 # matches "packageManager" in package.json

      # Rust toolchain (cargo/clippy/rustfmt) + the wasm32 target, so the wasm
      # backend can be built and its tests actually run (not silently skip).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # The mold linker — `.cargo/config.toml` pins `-fuse-ld=mold` for
      # x86_64-unknown-linux-gnu to speed linking the large test binaries. It must
      # be present or every Linux build fails at the link step.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lenke-engine

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: each package exports its types from dist/, and the root
      # typecheck has no source-path mapping, so `check`'s tsc only resolves
      # @lenke/* once dist/ exists. nx caches any unchanged build work.
      # `bun run build` builds the ffi cdylib (lenke-engine:build, uncached).
      #
      # @lenke/node is EXCLUDED here: `napi build --release` is a from-scratch
      # release compile of the engine (~75s) that nothing else in this job depends
      # on, and it was the lone tail of this step — every other project finished in
      # ~70s and then this one ran by itself. The `node-addon` job below owns it, on
      # Linux AND macOS, and runs its tests there. Excluding it in the workflow
      # rather than in the root script keeps a local `bun run build` complete.
      - name: Build
        run: bunx nx run-many -t build --exclude @lenke/node

      # The wasm artifact is NOT part of the nx build graph (a per-platform
      # cargo target), so build it explicitly here — otherwise the wasm backend
      # tests in `bun run test` skip themselves for lack of the `.wasm`.
      - name: Build wasm backend
        run: bun run build:wasm

      # typecheck + lint (oxlint + cargo clippy -D warnings) + format check
      # (oxfmt + cargo fmt --check), across both stacks.
      - name: Check
        run: bun run check

      # The TypeScript suites — all 20 projects together take ~2s, so this step is
      # cheap once the Rust work is elsewhere. The cargo suites move to the `rust`
      # job (which needs no bun build at all) so they run CONCURRENTLY with this
      # job instead of after it; `lenke-engine:test` alone was ~115s of a ~116s
      # step here. @lenke/node is excluded for the reason given at Build.
      - name: Test
        run: bunx nx run-many -t test --exclude @lenke/node,lenke-engine,lenke-engine-core

      # FFI canary: prove the cdylib built above loads and round-trips over bun:ffi.
      - name: FFI smoke test
        run: bun test packages/native/src/backend-engine.test.ts

  # ===========================================================================
  # The Rust test suites, in their own job so they run CONCURRENTLY with the
  # TypeScript job above rather than as its tail. They need no bun install and no
  # dist/ — only a toolchain — so there is nothing to wait for.
  #
  # (`cargo clippy` and `cargo fmt --check` stay in the other job's `check`: they
  # are ~10s there, and keeping one job that fails on any lint is worth more than
  # shaving that.)
  # ===========================================================================
  rust:
    name: cargo test (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      # `.cargo/config.toml` pins `-fuse-ld=mold` for x86_64-unknown-linux-gnu, so
      # the linker must be present or every build fails at the link step.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # Note this buys little today: rust-cache caches dependency artifacts and
      # cleans the workspace crate's own, and the engine is nearly dependency-free,
      # so almost every run is a from-scratch compile. It is kept for the rayon /
      # serde_json build and for whatever the crate grows.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/lenke-engine
            crates/lenke-engine-core

      - name: cargo test (lenke-engine)
        run: cargo test --manifest-path crates/lenke-engine/Cargo.toml

      - name: cargo test (lenke-engine-core)
        run: cargo test --manifest-path crates/lenke-engine-core/Cargo.toml

  # ===========================================================================
  # Native Node addon (@lenke/node) — build + test on Linux and macOS (arm64).
  #
  # A *native* build + `node --test` run on Apple Silicon (which the Linux `ci`
  # job above can't do), and the seam to later emit per-platform prebuilt
  # `.node` binaries (add an upload-artifact / napi publish step). Standard
  # runners (incl. macOS) are free on public repos, so this costs only CI
  # minutes / queue time.
  # ===========================================================================
  node-addon:
    name: node addon · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Portable x86-64 baseline for a distributable prebuilt — overrides
            # the AWS-tuned `x86-64-v3` in .cargo/config.toml, which would
            # SIGILL on pre-Haswell CPUs.
            cpu_baseline: x86-64-v2
          - os: macos-latest # Apple Silicon (arm64)
            # Pin a portable Apple-Silicon baseline instead of the config's
            # `target-cpu=native`, which bakes in the runner's exact CPU.
            cpu_baseline: apple-m1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/node
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `nx build @lenke/node` runs `napi build --platform --release --esm`
      # and (via ^build) builds the @lenke/native dep the test imports. The
      # RUSTFLAGS override replaces the config's per-target `target-cpu` so a
      # distributed prebuilt runs across the whole arch, not just the runner.
      - name: Build @lenke/node (napi ESM) with a portable CPU baseline
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu_baseline }}
        run: bunx nx build @lenke/node
      - name: Test @lenke/node
        working-directory: packages/node
        run: node --test
